name: Monthly maintenance report
on:
  schedule:
    - cron: '7 21 30 1,3-12 *'
      timezone: America/Chicago
    - cron: '7 21 28,29 2 *'
      timezone: America/Chicago
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read
  statuses: read
  checks: read
jobs:
  health:
    if: github.ref == 'refs/heads/main' && (vars.AUTOMATION_ENABLED == 'true' || vars.PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: calendar
        run: python3 -B maintenance.py --closing
      - if: steps.calendar.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_ENABLED: ${{ vars.PIPELINE_ENABLED }}
        run: python3 -B watch.py health
