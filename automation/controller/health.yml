name: Scheduler health
on:
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    if: vars.AUTOMATION_ENABLED == 'true' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_ENABLED: ${{ vars.PIPELINE_ENABLED }}
        run: python3 -B watch.py health
