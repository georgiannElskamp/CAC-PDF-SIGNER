name: Build candidate
on:
  push:
    branches: [research, release-verification]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    uses: ./.github/workflows/checks.yml
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build glibc 2.28 worker from pinned sources
        run: |
          mkdir "$RUNNER_TEMP/linux"
          docker build --pull -f native_linux/Dockerfile -t cac-linux-build .
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/linux,dst=/output" cac-linux-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-worker
          path: ${{ runner.temp }}/linux/linux-bundle.tar
          retention-days: 3
          if-no-files-found: error
  windows:
    needs: [source, linux]
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-worker
          path: ${{ runner.temp }}/build-input
      - run: python -m pip install -r requirements-build.txt
      - name: Verify bridge and unpack Linux bundle
        run: python -B tools/candidate.py inputs "$RUNNER_TEMP/build-input"
      - name: Build Windows worker and combined plugin
        run: python -B tools/build_standalone.py --output "$RUNNER_TEMP/candidate" --bridge "$RUNNER_TEMP/build-input/pdfsign-bridge.exe" --linux-bundle "$RUNNER_TEMP/build-input/linux-bundle"
      - name: Audit matching source and release files
        run: python -B tools/candidate.py finish "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate
          path: |
            ${{ runner.temp }}/candidate/CAC-PDF-Signer.plugin
            ${{ runner.temp }}/candidate/SHA256SUMS.txt
            ${{ runner.temp }}/candidate/INSTALL.txt
            ${{ runner.temp }}/candidate/editor.json
            ${{ runner.temp }}/candidate/metadata.json
            ${{ runner.temp }}/candidate/components.cdx.json
          retention-days: ${{ github.ref == 'refs/heads/release-verification' && 90 || 1 }}
          if-no-files-found: error
  validate:
    needs: windows
    uses: ./.github/workflows/candidate-checks.yml
  extended:
    needs: windows
    uses: ./.github/workflows/qualification.yml
  qualified:
    name: Candidate qualification
    if: always()
    needs: [source, linux, windows, validate, extended]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all candidate tests
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results=json.loads(os.environ['RESULTS'])
          assert results and all(job['result']=='success' for job in results.values()), results
          PY
