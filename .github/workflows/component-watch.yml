name: Bundled component watch
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: component-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check upstream versions and advisory feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/watch_components.py "$RUNNER_TEMP/components"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: component-report
          path: ${{ runner.temp }}/components
          retention-days: 14
          if-no-files-found: error
