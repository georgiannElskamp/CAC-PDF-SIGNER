name: Candidate checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        editor: [editor-installers.json, editor-installers-10.json]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
          path: ${{ runner.temp }}/input
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgbm1
      - name: Test packaged runtime
        run: python -B tools/verify_package.py "$RUNNER_TEMP/input/CAC-PDF-Signer.plugin"
      - name: Install PDF test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test installation and form signing in supported editor
        run: |
          command=(python -B tests/editor_ci.py "$RUNNER_TEMP/input/CAC-PDF-Signer.plugin" --form-handoff --manifest "tests/${{ matrix.editor }}")
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a "${command[@]}"; else "${command[@]}"; fi
  signing:
    strategy:
      fail-fast: false
      matrix:
        editor: [editor-installers.json, editor-installers-10.json]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
          path: ${{ runner.temp }}/input
      - name: Test simulated signing
        run: |
          cp "tests/${{ matrix.editor }}" "$RUNNER_TEMP/input/editor.json"
          bash tests/linux/run-container.sh "$RUNNER_TEMP/input" "$RUNNER_TEMP/report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-signing-report-${{ matrix.editor }}
          path: |
            ${{ runner.temp }}/report/signing-result.json
            ${{ runner.temp }}/report/signed-preview.png
            ${{ runner.temp }}/report/field-screen.png
            ${{ runner.temp }}/report/ui-failure.png
            ${{ runner.temp }}/report/editor-failure.log
          retention-days: 90
          if-no-files-found: error
