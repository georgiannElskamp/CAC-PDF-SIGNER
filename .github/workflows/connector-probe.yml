name: Connector review trigger probes
on:
  pull_request:
    types: [synchronize]
permissions: {}
concurrency:
  group: connector-review-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  request-diagnosis:
    if: >-
      github.repository == 'georgiannElskamp/CAC-PDF-SIGNER' &&
      github.actor == 'georgiannElskamp' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/codex-connector-probe-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Test the exact review trigger and a bot-created PR
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          endpoint = (
              "https://api.github.com/repos/georgiannElskamp/CAC-PDF-SIGNER/issues/"
              f"{event['pull_request']['number']}/comments"
          )
          marker = "CAC-REVIEW-BOT-20260922-D"
          body = "@codex review"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(f"GitHub API HTTP {error.code}: {error.read().decode('utf-8')}")
                  raise

          page = 1
          already_posted = False
          while True:
              comments = request(f"{endpoint}?per_page=100&page={page}")
              if any(
                  comment["user"]["login"] == "github-actions[bot]"
                  and comment["body"].strip() == body
                  for comment in comments
              ):
                  print("The approved request already exists; nothing posted.")
                  already_posted = True
                  break
              if len(comments) < 100:
                  break
              page += 1

          if not already_posted:
              comment = request(endpoint, {"body": body})
              print(json.dumps({
                  "kind": "exact-review-comment",
                  "id": comment["id"],
                  "url": comment["html_url"],
                  "created_at": comment["created_at"],
                  "marker": marker,
                  "head_sha": event["pull_request"]["head"]["sha"],
              }))

          repo = "https://api.github.com/repos/georgiannElskamp/CAC-PDF-SIGNER"
          branch = "research/codex-auto-review-probe-20260922"
          head_sha = event["pull_request"]["head"]["sha"]
          refs = request(f"{repo}/git/matching-refs/heads/{branch}")
          matching = [ref for ref in refs if ref["ref"] == f"refs/heads/{branch}"]
          if matching:
              if matching[0]["object"]["sha"] != head_sha:
                  raise SystemExit("The auto-review test branch already has a different commit.")
          else:
              request(f"{repo}/git/refs", {"ref": f"refs/heads/{branch}", "sha": head_sha})

          existing = request(
              f"{repo}/pulls?state=all&head=georgiannElskamp:{branch}&base=main"
          )
          if existing:
              print(json.dumps({"kind": "existing-auto-review-pr", "url": existing[0]["html_url"]}))
              raise SystemExit(0)

          pull = request(f"{repo}/pulls", {
              "title": "test: temporary bot-authored automatic review probe",
              "head": branch,
              "base": "main",
              "draft": False,
              "body": (
                  "Controlled review-only integration test, marker CAC-AUTO-REVIEW-20260922-E. "
                  "This PR is opened by GitHub Actions to test automatic Codex review. "
                  "No mention command is posted on this PR.\n\n"
                  "The synthetic report in research/connector-probe.json expects 0.0.0, "
                  "observes 0.7.0-rc.6 and lists 0.7.0-rc.6 as approved. Review this report "
                  "and identify the mismatch, its cause and the smallest justified correction. "
                  "Include the test marker in any diagnostic response. No installation or signing "
                  "failure is claimed.\n\n"
                  "Do not edit files, push commits, change settings, access credentials or publish "
                  "a release. This temporary PR will be closed without merging and its branch removed. "
                  "The probe workflow is restricted to a different branch and does not post here."
              ),
          })
          print(json.dumps({
              "kind": "auto-review-pr",
              "number": pull["number"],
              "url": pull["html_url"],
              "author": pull["user"]["login"],
              "created_at": pull["created_at"],
              "head_sha": pull["head"]["sha"],
          }))
