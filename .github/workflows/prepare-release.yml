name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Build candidate run ID from main (new version required)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Require a tested candidate from main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run }}
        run: python3 -B harness/tools/prepare_release.py inspect "$RUN_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.candidate.outputs.source_commit }}
          path: candidate-source
          persist-credentials: false
      - name: Audit exact tested bytes against candidate source
        run: |
          mkdir candidate-source/release
          cp "$RUNNER_TEMP/candidate/CAC-PDF-Signer.plugin" "$RUNNER_TEMP/candidate/SHA256SUMS.txt" "$RUNNER_TEMP/candidate/INSTALL.txt" candidate-source/release/
          python3 -B candidate-source/tools/publish_release.py
      - name: Stage draft and request gated publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: python3 -B harness/tools/prepare_release.py stage candidate-source "$RUNNER_TEMP/candidate" "$SOURCE_COMMIT"
