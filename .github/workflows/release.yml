name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag with uploaded draft assets
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      release_tag: ${{ inputs.tag }}
  publish:
    needs: [checks, packaged-runtime, editor-installation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern CAC-PDF-Signer.plugin --pattern SHA256SUMS.txt --pattern INSTALL.txt --dir release
          python -B tools/publish_release.py --tag "$RELEASE_TAG"
      - name: Publish verified draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --verify-tag
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --verify-tag
          fi
  packaged-runtime:
    needs: checks
    permissions:
      contents: write # GitHub requires push access to read draft release assets.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Download the draft plugin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern CAC-PDF-Signer.plugin --dir release
      - name: Run the uploaded native runtime
        run: python -B tools/verify_package.py release/CAC-PDF-Signer.plugin
  editor-installation:
    needs: packaged-runtime
    timeout-minutes: 20
    permissions:
      contents: write # GitHub requires push access to read draft release assets.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Download the draft plugin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern CAC-PDF-Signer.plugin --dir release
      - name: Prepare the Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Test installation on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B tests/editor_ci.py release/CAC-PDF-Signer.plugin
      - name: Test installation on Windows
        if: runner.os == 'Windows'
        run: python -B tests/editor_ci.py release/CAC-PDF-Signer.plugin
