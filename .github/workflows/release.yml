name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag with uploaded draft assets
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      release_tag: ${{ inputs.tag }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Publish verified draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --verify-tag
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --verify-tag
          fi
