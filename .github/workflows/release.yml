name: Publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Check maintainer approval and exact candidate
        id: approved
        run: python -B tools/promote_release.py inspect "$RUNNER_TEMP/candidate"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.approved.outputs.artifact }}
          run-id: ${{ steps.approved.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Audit the package against approved source
        run: python -B tools/promote_release.py validate "$RUNNER_TEMP/candidate"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ runner.temp }}/candidate/CAC-PDF-Signer.plugin
            ${{ runner.temp }}/candidate/release-evidence.json
      - name: Verify attested package provenance
        run: gh attestation verify "$RUNNER_TEMP/candidate/CAC-PDF-Signer.plugin" --repo "$GITHUB_REPOSITORY"
      - name: Publish the tested bytes
        run: python -B tools/promote_release.py publish "$RUNNER_TEMP/candidate"
