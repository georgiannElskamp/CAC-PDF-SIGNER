name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag with uploaded draft assets
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      release_tag: ${{ inputs.tag }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern CAC-PDF-Signer.plugin --pattern SHA256SUMS.txt --pattern INSTALL.txt --dir release
          python -B publish_release.py --tag "$RELEASE_TAG"
      - name: Publish verified draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --verify-tag
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --verify-tag
          fi
