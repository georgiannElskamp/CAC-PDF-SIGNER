version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: research
    schedule:
      interval: cron
      cronjob: '17 1 30 * *'
      timezone: America/Chicago
    # Version PRs come from the shared monthly controller, including February.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      test-and-build:
        patterns: [reportlab, pyinstaller, pyinstaller-hooks-contrib]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: research
    schedule:
      interval: cron
      cronjob: '17 1 30 * *'
      timezone: America/Chicago
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
