version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: research
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      test-and-build:
        patterns: [reportlab, pyinstaller, pyinstaller-hooks-contrib]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: research
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
